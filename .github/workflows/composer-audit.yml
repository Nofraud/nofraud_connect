name: Composer Audit

on:
  pull_request:
    paths:
      - "composer.json"
  schedule:
    # Weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.1"
          tools: composer:v2

      # --strict omitted: the `version` field triggers a warning but is
      # intentionally present (managed by semantic-release).
      - name: Validate composer.json
        run: composer validate

      # This module is a library with no composer.lock and no installed vendors.
      # `composer audit` cannot run without either. The real audit happens at
      # the merchant's Magento project root where dependencies are resolved.
      - name: Audit notice
        run: |
          echo "::notice::This is a Magento library module with no composer.lock or vendor directory. Dependency vulnerability scanning must be performed at the merchant's Magento project root via 'composer audit'. This workflow validates composer.json structure only."
